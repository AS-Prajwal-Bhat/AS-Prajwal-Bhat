<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">RISC-V SoC block diagram</title>
  <desc id="d">A five-stage RISC-V core connects through an AXI4-Lite bridge and MMIO bus to a UART, shared Block RAM, a DCT accelerator and a LeNet-5 CNN accelerator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1a13"/><stop offset="1" stop-color="#060d0a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.40"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#B5C9A5" stop-opacity="0.30"/></linearGradient>
    <style>
      .sans{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace}
      .flow{stroke-dasharray:8 6;animation:flow 1.4s linear infinite}
      @keyframes flow{to{stroke-dashoffset:-14}}
      .stage{fill-opacity:0.06;animation:stage 3s ease-in-out infinite}
      @keyframes stage{0%,100%{fill-opacity:0.06}10%,22%{fill-opacity:0.38}35%{fill-opacity:0.06}}
      @media (prefers-reduced-motion:reduce){.flow,.stage{animation:none}}
    </style>
  </defs>
  <rect width="800" height="400" rx="24" fill="url(#bg)"/>
  <rect x="20" y="20" width="760" height="130" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="56" y="56" class="mono" font-size="20" fill="#B9C0B2">RISC-V core, 5-stage pipeline</text>
  <rect x="56" y="76" width="128" height="52" rx="10" class="stage" style="animation-delay:0.0s" fill="#B5C9A5" stroke="#B5C9A5" stroke-opacity="0.45"/>
  <text x="120" y="110" text-anchor="middle" class="mono" font-size="22" fill="#E5E7DF">IF</text>
  <rect x="196" y="76" width="128" height="52" rx="10" class="stage" style="animation-delay:0.6s" fill="#B5C9A5" stroke="#B5C9A5" stroke-opacity="0.45"/>
  <text x="260" y="110" text-anchor="middle" class="mono" font-size="22" fill="#E5E7DF">ID</text>
  <rect x="336" y="76" width="128" height="52" rx="10" class="stage" style="animation-delay:1.2s" fill="#B5C9A5" stroke="#B5C9A5" stroke-opacity="0.45"/>
  <text x="400" y="110" text-anchor="middle" class="mono" font-size="22" fill="#E5E7DF">EX</text>
  <rect x="476" y="76" width="128" height="52" rx="10" class="stage" style="animation-delay:1.7999999999999998s" fill="#B5C9A5" stroke="#B5C9A5" stroke-opacity="0.45"/>
  <text x="540" y="110" text-anchor="middle" class="mono" font-size="22" fill="#E5E7DF">MEM</text>
  <rect x="616" y="76" width="128" height="52" rx="10" class="stage" style="animation-delay:2.4s" fill="#B5C9A5" stroke="#B5C9A5" stroke-opacity="0.45"/>
  <text x="680" y="110" text-anchor="middle" class="mono" font-size="22" fill="#E5E7DF">WB</text>
  <path d="M106 270 V226" class="flow" fill="none" stroke="#B5C9A5" stroke-width="2"/>
  <path d="M302 270 V226" class="flow" fill="none" stroke="#B5C9A5" stroke-width="2"/>
  <path d="M498 270 V226" class="flow" fill="none" stroke="#B5C9A5" stroke-width="2"/>
  <path d="M694 270 V226" class="flow" fill="none" stroke="#B5C9A5" stroke-width="2"/>
  <path d="M400 150 V190" class="flow" fill="none" stroke="#B5C9A5" stroke-width="2"/>
  <rect x="20" y="190" width="760" height="36" rx="10" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="400" y="214" text-anchor="middle" class="mono" font-size="18" fill="#E5E7DF">AXI4-Lite bridge, MMIO bus</text>
  <rect x="20" y="270" width="172" height="110" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="106" y="308" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E5E7DF">UART</text>
  <text x="106" y="338" text-anchor="middle" class="mono" font-size="16" fill="#B9C0B2">image in</text>
  <text x="106" y="360" text-anchor="middle" class="mono" font-size="16" fill="#899286">class out</text>
  <rect x="216" y="270" width="172" height="110" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="302" y="308" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E5E7DF">Block RAM</text>
  <text x="302" y="338" text-anchor="middle" class="mono" font-size="16" fill="#B9C0B2">shared</text>
  <text x="302" y="360" text-anchor="middle" class="mono" font-size="16" fill="#899286">with arbiter</text>
  <rect x="412" y="270" width="172" height="110" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="498" y="308" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E5E7DF">DCT</text>
  <text x="498" y="338" text-anchor="middle" class="mono" font-size="16" fill="#B9C0B2">8x8 blocks</text>
  <text x="498" y="360" text-anchor="middle" class="mono" font-size="16" fill="#899286">compression</text>
  <rect x="608" y="270" width="172" height="110" rx="16" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.2"/>
  <text x="694" y="308" text-anchor="middle" class="sans" font-size="24" font-weight="600" fill="#E5E7DF">CNN</text>
  <text x="694" y="338" text-anchor="middle" class="mono" font-size="16" fill="#B9C0B2">LeNet-5</text>
  <text x="694" y="360" text-anchor="middle" class="mono" font-size="16" fill="#899286">int8 weights</text>
</svg>
